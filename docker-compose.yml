# In-game tests and Lua linting for the mod in ./src (run-tests.ps1 wraps all of this).
#   docker compose run --rm lint                                        # luacheck src (.luacheckrc)
#   docker compose run --rm typecheck                                   # Factorio API type check of src
#   docker compose build tests
#   docker compose run --rm tests                                       # headless tests
#   docker compose run --rm tests give_items --tag-blacklist needs-player --bail
#     (name filters first: --tag-blacklist takes several values)
# Versions can be overridden with env vars or a .env file next to this file.
name: freeplay-starting-equipment-tests

services:
  tests:
    build:
      context: ./docker
      args:
        FACTORIO_VERSION: ${FACTORIO_VERSION:-2.1.20}
        FACTORIO_TEST_CLI_VERSION: ${FACTORIO_TEST_CLI_VERSION:-3.6.0}
    image: factorio-mod-tests:${FACTORIO_VERSION:-2.1.20}
    # Factorio headless is x86-64 only; ARM hosts (Snapdragon laptops, Apple Silicon) run it emulated.
    platform: linux/amd64
    volumes:
      # mod folder with info.json; run-tests.ps1 sets MOD_DIR from -ModDir.
      # create_host_path: false -> a missing/unshared folder is an error instead of an empty /mod.
      - type: bind
        source: ${MOD_DIR:-./src}
        target: /mod
        bind:
          create_host_path: false

  # Lua linting (config: .luacheckrc). docker compose run --rm lint [luacheck args]
  lint:
    image: ghcr.io/lunarmodules/luacheck:v1.2.0
    volumes:
      - type: bind
        source: .
        target: /data
        read_only: true
    command: ["src"]

  # Type check against the Factorio API (LuaPlayer, defines, events...). docker compose run --rm typecheck [dir]
  typecheck:
    build:
      context: ./docker
      dockerfile: typecheck.Dockerfile
      args:
        FACTORIO_VERSION: ${FACTORIO_VERSION:-2.1.20}
        LUALS_VERSION: ${LUALS_VERSION:-3.19.1}
    image: factorio-mod-typecheck:${FACTORIO_VERSION:-2.1.20}
    platform: linux/amd64
    volumes:
      - type: bind
        source: .
        target: /data
        read_only: true
    command: ["src"]
